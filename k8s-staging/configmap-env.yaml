apiVersion: v1
kind: ConfigMap
metadata:
  name: affnet-env
  namespace: affnet-staging
data:
  NODE_ENV: production
  # Share core dependencies from the 'affnet' namespace
  KAFKA_BROKERS: kafka.affnet.svc.cluster.local:9092
  REDIS_HOST: redis-master.affnet.svc.cluster.local
  REDIS_PORT: "6379"
  POSTGRES_HOST: postgresql.affnet.svc.cluster.local
  POSTGRES_PORT: "5432"
  POSTGRES_DB: affnet
  AUTH_SERVICE_URL: http://auth-service.affnet-staging.svc.cluster.local:3000
  CLICK_SERVICE_URL: http://click-service.affnet-staging.svc.cluster.local:3000
  CONVERSION_SERVICE_URL: http://conversion-service.affnet-staging.svc.cluster.local:3000
  POSTBACK_SERVICE_URL: http://postback-service.affnet-staging.svc.cluster.local:3000
  MEDIA_BUY_SERVICE_URL: http://media-buy-service.affnet-staging.svc.cluster.local:3000
  AI_TOOLS_SERVICE_URL: http://ai-tools-service.affnet-staging.svc.cluster.local:3000
  REPORTING_SERVICE_URL: http://reporting-service.affnet-staging.svc.cluster.local:3000
  CATALOG_SERVICE_URL: http://catalog-service.affnet-staging.svc.cluster.local:3000
