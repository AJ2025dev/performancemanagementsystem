apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-buy-service
  namespace: affnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-buy-service
  template:
    metadata:
      labels:
        app: media-buy-service
    spec:
      containers:
        - name: media-buy-service
          image: ghcr.io/your-org/media-buy-service:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: affnet-env }
            - secretRef: { name: affnet-secrets }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: media-buy-service
  namespace: affnet
spec:
  type: ClusterIP
  selector:
    app: media-buy-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000

