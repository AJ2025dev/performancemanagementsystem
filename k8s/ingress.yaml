apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affnet-ingress
  namespace: affnet
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80

