name: Build/Test/Deploy Service

on:
  push:
    paths:
      - 'services/${{ inputs.service }}/**'
      - '.github/workflows/${{ github.workflow }}'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service folder name'
        required: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.service }}:sha-${{ github.sha }}
      NAMESPACE: ${{ startsWith(github.ref, 'refs/heads/staging') && 'affnet-staging' || 'affnet' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        working-directory: services/${{ inputs.service }}
        run: npm ci
      - name: Test
        working-directory: services/${{ inputs.service }}
        run: npm test -- --ci --passWithNoTests
      - name: Build
        working-directory: services/${{ inputs.service }}
        run: npm run build
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          push: true
          tags: ${{ env.IMAGE }}
      - name: Set Kubeconfig
        if: ${{ secrets.KUBE_CONFIG_BASE64 != '' }}
        run: echo "${KUBE_CONFIG_BASE64}" | base64 -d > kubeconfig
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
      - name: Deploy
        if: ${{ secrets.KUBE_CONFIG_BASE64 != '' }}
        run: |
          kubectl --kubeconfig kubeconfig -n $NAMESPACE set image deploy/${{ inputs.service }} ${{ inputs.service }}=${{ env.IMAGE }}
