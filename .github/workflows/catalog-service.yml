name: catalog-service CI/CD

on:
  push:
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SERVICE: catalog-service
      IMAGE: ghcr.io/${{ github.repository }}/catalog-service:sha-${{ github.sha }}
      NAMESPACE: ${{ startsWith(github.ref, 'refs/heads/staging') && 'affnet-staging' || 'affnet' }}
      KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Compute image tag (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}/${SERVICE}:sha-${GITHUB_SHA}" >> $GITHUB_ENV
      - name: Install deps
        working-directory: services/${{ env.SERVICE }}
        run: npm ci || npm install
      - name: Test
        working-directory: services/${{ env.SERVICE }}
        run: npm test -- --ci --passWithNoTests
      - name: Build
        working-directory: services/${{ env.SERVICE }}
        run: npm run build
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT != '' && secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: true
          tags: ${{ env.IMAGE }}
      - name: Set Kubeconfig
        if: ${{ env.KUBE_CONFIG_BASE64 != '' }}
        run: echo "${KUBE_CONFIG_BASE64}" | base64 -d > kubeconfig
      - name: Deploy
        if: ${{ env.KUBE_CONFIG_BASE64 != '' }}
        run: kubectl --kubeconfig kubeconfig -n $NAMESPACE set image deploy/catalog-service catalog-service=${{ env.IMAGE }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.29.6'
      - name: Print deploy context
        run: echo "Ref=$GITHUB_REF Namespace=$NAMESPACE"
